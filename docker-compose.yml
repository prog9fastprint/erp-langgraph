services:
  erp-ai-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp-ai-orchestrator
    restart: unless-stopped
    network_mode: "host"
    env_file:
      - .env
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8002
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
